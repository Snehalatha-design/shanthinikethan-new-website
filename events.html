<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Calendar - Shanthinikethan</title>
     <title>Shanthinikethan | Academic Calendar 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
   :root {
            --primary-blue: #2d50a0;
            --sidebar-blue: #3b5998;
            --bg-light: #f8fafd;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
        }

        /* CALENDAR MAIN CONTAINER */
        .cal-container {
            max-width: 1400px;
            margin: 40px auto;
            background: #fff;
            border-radius: 24px;
            display: flex;
            min-height: 850px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
        }

        /* LEFT SIDEBAR NAVIGATION */
        .cal-sidebar {
            width: 100px;
            background: var(--sidebar-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            gap: 40px;
            color: #fff;
        }

        /* .nav-item {
            cursor: pointer;
            text-align: center;
            opacity: 0.7;
            transition: 0.3s;
            font-size: 11px;
            width: 100%;
            color: white;
        } */

        .nav-item i {
            font-size: 24px;
            display: block;
            margin-bottom: 8px;
        }

        .nav-item.active {
            opacity: 1;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px 0;
            width: 80%;
        }

        /* MAIN CONTENT AREA */
        .cal-content {
            flex: 1;
            padding: 40px;
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .month-label h1 {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary-blue);
        }

        .month-label span {
            color: #d1d5db;
            font-weight: 300;
        }

        .header-actions {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .view-toggle {
            background: #f1f5f9;
            padding: 5px;
            border-radius: 10px;
            display: flex;
        }

        .v-btn {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .v-btn.active {
            background: var(--primary-blue);
            color: #fff;
        }

        .tool-btn {
            color: #64748b;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            background: none;
            padding: 6px 12px;
            border-radius: 30px;
            transition: background 0.2s;
        }

        .tool-btn:hover {
            background: #f1f5f9;
        }

        /* CALENDAR GRID */
        .calendar-grid {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
        }

        .grid-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: var(--primary-blue);
            color: #fff;
            text-align: center;
            padding: 12px 0;
            font-size: 12px;
            font-weight: 700;
        }

        .grid-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .day-box {
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            min-height: 110px;
            padding: 12px;
            position: relative;
            transition: background 0.1s;
        }

        .day-num {
            font-weight: 700;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }

        .day-box.current-month .day-num {
            color: #1e293b;
        }

        .day-box.today {
            background: #fffbeb;
            border: 2px solid #fbbf24 !important;
        }

        /* EVENT TAGS */
        .event-tag {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 6px;
            border-radius: 6px;
            margin-bottom: 4px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .event-tag:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        /* RIGHT SUMMARY PANEL */
        .cal-right-panel {
            width: 320px;
            border-left: 1px solid var(--border-color);
            padding: 40px 25px;
            background: #fff;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-blue);
            margin-bottom: 25px;
        }

        .special-day-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 12px;
            transition: 0.2s;
            cursor: pointer;
        }

        .special-day-item:hover {
            background: #f8fafc;
            transform: translateX(4px);
        }

        .icon-box {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }

        /* LEGEND */
        .cal-legend {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* MODALS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            background: #fff;
            padding: 28px;
            border-radius: 28px;
            width: 380px;
            max-width: 90%;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-body h3 {
            margin-bottom: 20px;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-group {
            margin-bottom: 18px;
        }

        .setting-group label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .filter-check {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .filter-check input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        hr {
            margin: 15px 0;
            border-color: #eef2ff;
        }

        .apply-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .apply-btn:hover {
            background: #1f3a7a;
        }

        /* DETAIL MODAL */
        .detail-modal {
            width: 400px;
            text-align: center;
        }

        .detail-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .detail-date {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-blue);
            margin: 10px 0;
        }

        .detail-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .detail-desc {
            color: #475569;
            line-height: 1.5;
            margin: 15px 0;
        }

        @media print {

            .cal-sidebar,
            .header-actions,
            #dynamic-header,
            #dynamic-footer,
            .cal-right-panel,
            .modal-overlay {
                display: none !important;
            }

            .cal-container {
                box-shadow: none;
                border: none;
                margin: 0;
            }

            .day-box {
                break-inside: avoid;
            }
        }

    </style>
</head>

<body>

    <div id="header"></div>
    <!-- <script src="header.js"></script> -->


 <section class="cal-section" style="padding: 10px;">
        <div class="cal-container" id="captureArea">
            <div class="cal-sidebar">
                <div class="nav-item" onclick="changeCategory('all', this)"><i class="fas fa-calendar-alt"></i>Calendar
                </div>
                <div class="nav-item" onclick="changeCategory('today', this)"><i class="far fa-clock"></i>Today</div>
                <div class="nav-item" onclick="changeCategory('holiday', this)"><i class="far fa-star"></i>Holidays
                </div>
                <div class="nav-item" onclick="openSettings()"><i class="fas fa-cog"></i>Settings</div>
            </div>

            <div class="cal-content">
                <div class="cal-header">
                    <div class="month-label">
                        <h1 id="monthYearDisplay">May <span>2026</span></h1>
                        <p style="color: #94a3b8; font-size: 13px;">Plan your month. Stay organized.</p>
                    </div>
                    <div class="header-actions">
                        <div class="view-toggle">
                            <button class="v-btn active" onclick="setView('month', this)">Month</button>
                            <button class="v-btn" onclick="setView('week', this)">Week</button>
                        </div>
                        <button class="tool-btn" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
                        <button class="tool-btn" onclick="downloadCalendar()"><i class="fas fa-download"></i>
                            Download</button>
                        <button class="tool-btn" onclick="openSettings()"><i class="fas fa-filter"></i> Filter</button>
                    </div>
                </div>

                <div class="calendar-grid">
                    <div class="grid-weekdays">
                        <span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span>
                    </div>
                    <div class="grid-days" id="calendarGridBody">
                    </div>
                </div>

                <div class="cal-legend" id="legendArea">
                    <!-- dynamic legend based on filters -->
                </div>
            </div>

            <div class="cal-right-panel">
                <h3 class="panel-title">📅 May Special Days</h3>
                <div id="sideEventList"></div>
                <button class="tool-btn"
                    style="width:100%; justify-content:center; margin-top:20px; border:1px solid #e2e8f0; padding:10px; border-radius:10px;"
                    onclick="openSettings()">⚙️ Customize Filters</button>
            </div>
        </div>
    </section>

    <!-- SETTINGS MODAL (Enhanced with multiple options) -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-body">
            <h3><i class="fas fa-sliders-h"></i> Calendar Settings</h3>
            <div class="setting-group">
                <label>📌 Show event types:</label>
                <div class="filter-check">
                    <input type="checkbox" id="filterNational" checked> <span>🇮🇳 National Days (Orange)</span>
                </div>
                <div class="filter-check">
                    <input type="checkbox" id="filterInternational" checked> <span>🌍 International Days (Blue)</span>
                </div>
                <div class="filter-check">
                    <input type="checkbox" id="filterAwareness" checked> <span>⚠️ Awareness Days (Purple)</span>
                </div>
            </div>
            <hr>
            <div class="setting-group">
                <label>✨ Display options:</label>
                <div class="filter-check">
                    <input type="checkbox" id="highlightTodayToggle" checked> <span>🌟 Highlight Today (May 26,
                        2026)</span>
                </div>
                <div class="filter-check">
                    <input type="checkbox" id="darkModeToggle"> <span>🌙 Dark Mode (experimental invert)</span>
                </div>
            </div>
            <button class="apply-btn" id="applySettingsBtn"><i class="fas fa-check-circle"></i> Apply & Refresh</button>
        </div>
    </div>

    <!-- DETAIL MODAL (for special day click) -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-body detail-modal">
            <div id="detailContent"></div>
            <button class="apply-btn" style="background:#64748b;" onclick="closeDetailModal()">Close</button>
        </div>
    </div>




    <div id="footer"></div>
    <script src="footer.js"></script>

  <script>
        // ======================== EXTERNAL HEADER/FOOTER ========================
        function loadExternal(src, id, fallback) {
            const script = document.createElement('script');
            script.src = src;
            script.onerror = () => { const el = document.getElementById(id); if (el) el.innerHTML = fallback; };
            document.body.appendChild(script);
        }
        loadExternal('header.js', 'dynamic-header', '<div style="padding:20px; background:#2d50a0; color:#fff; text-align:center;">🏫 Shanthinikethan Institute</div>');
        loadExternal('footer.js', 'dynamic-footer', '<div style="padding:20px; background:#2d50a0; color:#fff; text-align:center;">© 2026 Academic Calendar</div>');

        // ======================== MASTER DATA ========================
        const allEvents = [
            { day: 1, title: "Labour Day", type: "national", color: "#f59e0b", icon: "fa-briefcase", description: "International Workers' Day, celebrating labor movement and workers' rights." },
            { day: 4, title: "Firefighters' Day", type: "awareness", color: "#c084fc", icon: "fa-fire-extinguisher", description: "Honoring the bravery and sacrifice of firefighters worldwide." },
            { day: 8, title: "Red Cross Day", type: "international", color: "#3b82f6", icon: "fa-heartbeat", description: "Birth anniversary of Henry Dunant, founder of Red Cross. Promotes humanitarian aid." },
            { day: 11, title: "National Technology Day", type: "national", color: "#f59e0b", icon: "fa-microchip", description: "Commemorating India's technological advancements and achievements." },
            { day: 12, title: "Nurses Day", type: "international", color: "#3b82f6", icon: "fa-user-nurse", description: "Honoring nurses for their dedication and care in healthcare systems." },
            { day: 15, title: "International Family Day", type: "international", color: "#3b82f6", icon: "fa-users", description: "Celebrating importance of families and family values across the globe." },
            { day: 21, title: "Anti-Terrorism Day", type: "awareness", color: "#a855f7", icon: "fa-shield-alt", description: "Observed to spread awareness against terrorism and promote peace." },
            { day: 31, title: "World No Tobacco Day", type: "international", color: "#3b82f6", icon: "fa-smoking-ban", description: "Raising awareness about harmful effects of tobacco use." }
        ];

        // Today is May 26, 2026 (as per reference)
        const TODAY_DATE = 26;

        // Global state
        let currentFilters = {
            showNational: true,
            showInternational: true,
            showAwareness: true,
            highlightToday: true,
            darkMode: false
        };
        let currentView = "month";

        // Helper: filter events based on currentFilters
        function getFilteredEvents() {
            return allEvents.filter(ev => {
                if (ev.type === "national" && !currentFilters.showNational) return false;
                if (ev.type === "international" && !currentFilters.showInternational) return false;
                if (ev.type === "awareness" && !currentFilters.showAwareness) return false;
                return true;
            });
        }

        // Get events for a specific day (filtered)
        function getEventsForDay(day) {
            return getFilteredEvents().filter(ev => ev.day === day);
        }

        // Render full calendar (May 2026)
        function renderCalendar() {
            const grid = document.getElementById('calendarGridBody');
            const sideList = document.getElementById('sideEventList');
            grid.innerHTML = '';
            sideList.innerHTML = '';

            // May 2026 starts on Friday (index 5 = Friday)
            const startWeekday = 5; // 0=Sunday, 5=Friday
            const daysInMonth = 31;
            let emptyCells = startWeekday; // cells before day 1

            // Add empty cells
            for (let i = 0; i < emptyCells; i++) {
                grid.innerHTML += `<div class="day-box"></div>`;
            }

            // Render days 1-31
            for (let day = 1; day <= daysInMonth; day++) {
                const dayEvents = getEventsForDay(day);
                const isToday = (day === TODAY_DATE);
                const todayClass = (isToday && currentFilters.highlightToday) ? 'today' : '';

                let eventHtml = '';
                dayEvents.forEach(ev => {
                    eventHtml += `<div class="event-tag" style="background:${ev.color}" onclick="showEventDetail(${ev.day}, '${ev.title}', '${ev.description}', '${ev.icon}', '${ev.color}'); event.stopPropagation();">
                                <i class="fas ${ev.icon}" style="font-size:8px; margin-right:4px;"></i> ${ev.title}
                              </div>`;
                });

                grid.innerHTML += `
                <div class="day-box current-month ${todayClass}" data-day="${day}">
                    <span class="day-num">${day}</span>
                    ${eventHtml}
                </div>
            `;
            }

            // Fill remaining cells to complete grid (6 rows * 7 = 42 cells)
            const totalCells = Math.ceil((emptyCells + daysInMonth) / 7) * 7;
            const filled = emptyCells + daysInMonth;
            for (let i = filled; i < totalCells; i++) {
                grid.innerHTML += `<div class="day-box"></div>`;
            }

            // Populate right side panel with Special Days (filtered)
            const filteredEvents = getFilteredEvents();
            // group unique by day (already unique per day)
            filteredEvents.sort((a, b) => a.day - b.day).forEach(ev => {
                sideList.innerHTML += `
                <div class="special-day-item" onclick="showEventDetail(${ev.day}, '${ev.title}', '${ev.description}', '${ev.icon}', '${ev.color}')">
                    <div class="icon-box" style="background:${ev.color}"><i class="fas ${ev.icon}"></i></div>
                    <div style="flex:1">
                        <p style="font-size:12px; font-weight:700;">May ${ev.day}</p>
                        <p style="font-size:11px; color:#64748b;">${ev.title}</p>
                    </div>
                    <i class="fas fa-chevron-right" style="color:#cbd5e1; font-size:12px;"></i>
                </div>
            `;
            });

            if (filteredEvents.length === 0) {
                sideList.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8;">No events match current filters ✨</div>';
            }

            // Update legend dynamically
            updateLegend();

            // Apply week view styling if needed
            adjustViewHeight();
        }

        function updateLegend() {
            const legendContainer = document.getElementById('legendArea');
            let items = [];
            if (currentFilters.showNational) items.push('<div class="legend-item"><span class="dot" style="background:#f59e0b;"></span> National Days</div>');
            if (currentFilters.showInternational) items.push('<div class="legend-item"><span class="dot" style="background:#3b82f6;"></span> International Days</div>');
            if (currentFilters.showAwareness) items.push('<div class="legend-item"><span class="dot" style="background:#a855f7;"></span> Awareness Days</div>');
            if (items.length === 0) items.push('<span style="color:#94a3b8;">No categories selected</span>');
            legendContainer.innerHTML = items.join('');
        }

        function adjustViewHeight() {
            const dayBoxes = document.querySelectorAll('.day-box');
            if (currentView === 'week') {
                dayBoxes.forEach(box => box.style.minHeight = '200px');
            } else {
                dayBoxes.forEach(box => box.style.minHeight = '110px');
            }
        }

        // View Toggle
        function setView(view, btn) {
            currentView = view;
            document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            adjustViewHeight();
        }

        // Settings Modal Logic (enhanced)
        function openSettings() {
            // sync modal checkboxes with currentFilters
            document.getElementById('filterNational').checked = currentFilters.showNational;
            document.getElementById('filterInternational').checked = currentFilters.showInternational;
            document.getElementById('filterAwareness').checked = currentFilters.showAwareness;
            document.getElementById('highlightTodayToggle').checked = currentFilters.highlightToday;
            document.getElementById('darkModeToggle').checked = currentFilters.darkMode;
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function applySettingsAndRefresh() {
            // read values from modal
            const showNat = document.getElementById('filterNational').checked;
            const showInt = document.getElementById('filterInternational').checked;
            const showAware = document.getElementById('filterAwareness').checked;
            const highlight = document.getElementById('highlightTodayToggle').checked;
            const darkModeFlag = document.getElementById('darkModeToggle').checked;

            currentFilters.showNational = showNat;
            currentFilters.showInternational = showInt;
            currentFilters.showAwareness = showAware;
            currentFilters.highlightToday = highlight;
            currentFilters.darkMode = darkModeFlag;

            // apply dark mode globally
            if (darkModeFlag) {
                document.body.style.filter = 'invert(0.92) hue-rotate(180deg)';
            } else {
                document.body.style.filter = 'none';
            }

            // re-render calendar & side panel
            renderCalendar();
            closeSettings();
        }

        // Detail Modal for Event
        function showEventDetail(day, title, description, icon, color) {
            const detailContainer = document.getElementById('detailContent');
            detailContainer.innerHTML = `
            <div class="detail-icon" style="background:${color}; width:70px; height:70px; margin:0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                <i class="fas ${icon}" style="font-size:36px; color:white;"></i>
            </div>
            <div class="detail-date">📅 May ${day}, 2026</div>
            <div class="detail-title">${title}</div>
            <div class="detail-desc">${description}</div>
            <small style="color:#94a3b8;">Click on any event or special day to see details.</small>
        `;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        // Download / Print & other utilities
        function downloadCalendar() {
            alert("📄 Preparing personalized calendar PDF. Use 'Print' → 'Save as PDF' for best results.");
            window.print();
        }

        // Category navigation (sidebar)
        function changeCategory(cat, el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            if (cat === 'today') {
                // scroll to today's cell if exists
                const todayCell = document.querySelector('.day-box.today');
                if (todayCell) {
                    todayCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    alert("Today (May 26) is visible. Check 'Highlight Today' in settings if not visible.");
                }
            } else if (cat === 'holiday') {
                // optional: filter only events? but for simplicity, open settings or alert
                openSettings();
            }
        }

        // Dark mode standalone function (backward compat)
        function applyDarkMode() {
            const isDark = document.getElementById('darkToggle')?.checked || false;
            currentFilters.darkMode = isDark;
            document.body.style.filter = isDark ? 'invert(0.92) hue-rotate(180deg)' : 'none';
            renderCalendar();
        }

        // Initialize and attach event listeners
        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            const applyBtn = document.getElementById('applySettingsBtn');
            if (applyBtn) applyBtn.addEventListener('click', applySettingsAndRefresh);
            // Close modals on clicking outside
            const modal = document.getElementById('settingsModal');
            modal.addEventListener('click', (e) => { if (e.target === modal) closeSettings(); });
            const detailModal = document.getElementById('detailModal');
            detailModal.addEventListener('click', (e) => { if (e.target === detailModal) closeDetailModal(); });
        });

        // Expose global functions
        window.setView = setView;
        window.openSettings = openSettings;
        window.closeSettings = closeSettings;
        window.applyDarkMode = applyDarkMode;
        window.downloadCalendar = downloadCalendar;
        window.changeCategory = changeCategory;
        window.showEventDetail = showEventDetail;
        window.closeDetailModal = closeDetailModal;
